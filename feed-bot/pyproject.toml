[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-bot"
version = "0.1.0"
description = "Public bug bounty feed for GitHub Actions, Telegram, and Pages"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
feed-bot = "feed_bot.cli:main"

[tool.setuptools.packages.find]
include = ["feed_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
