name: bug bounty feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "feed-bot[dev]"
      - name: Test
        run: python -m pytest feed-bot/tests -q

  ingest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed-bot
        run: python -m pip install -e feed-bot

      - name: Ingest
        env:
          HACKENPROOF_API_KEY: ${{ secrets.HACKENPROOF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ secrets.PAGES_URL || 'https://huyvux12.github.io/Bugbounty_hunter/' }}
        run: python -m feed_bot --data-dir data --docs-dir docs

      - name: Commit snapshot
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feed: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi
